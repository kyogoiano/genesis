plugins {
    id 'base'
}

group = 'net.java.dev.genesis'
version = '3.3'

allprojects {
    repositories {
        // AspectWerkz 2.1's published POM group differs from its Central path.
        maven {
            url = uri('https://repo.maven.apache.org/maven2')
            content {
                includeModule('org.codehaus', 'aspectwerkz-nodeps-jdk5')
                includeModule('org.codehaus', 'aspectwerkz-jdk5')
            }
            metadataSources {
                artifact()
            }
        }
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    sourceSets {
        main {
            java.setSrcDirs(['src'])
            resources.setSrcDirs([])
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_1_9)) {
            options.release.set(8)
        }
    }

    tasks.named('jar') {
        archiveBaseName.set("genesis-${project.name}")
    }
}

project(':shared') {
    sourceSets.main.java.srcDir project(':annotation').file('src')
    sourceSets.main.resources.srcDir('src')
    sourceSets.main.resources.include('**/Bundle*.properties')

    dependencies {
        api('org.hibernate:hibernate:3.2.7.ga') {
            exclude group: 'javax.transaction', module: 'jta'
        }
        api 'javax.transaction:jta:1.1'
        api libs.commons.beanutils
        api libs.commons.logging
        api files(rootProject.file('lib/commons/reusable-components-20060810.jar'))
    }
}

project(':server') {
    def generatedSources = layout.buildDirectory.dir('generated/sources/xdoclet/main')

    sourceSets.main.java.srcDir(generatedSources)
    sourceSets.main.resources.srcDir(generatedSources)
    sourceSets.main.resources.include('**/*.xml')

    dependencies {
        implementation project(':shared')
        implementation 'javax.ejb:ejb-api:3.0'
    }

    tasks.register('generateEjbSources') {
        inputs.files(fileTree('src') { include '**/*EJB.java' })
        inputs.files(
                rootProject.file('build.xml'),
                rootProject.file('build.properties'),
                rootProject.file('project.properties'),
                fileTree(rootProject.file('../xdoclet/dist'))
        )
        outputs.dir(generatedSources)

        doLast {
            def destination = generatedSources.get().asFile
            delete destination
            destination.mkdirs()

            ant.ant(
                    antfile: rootProject.file('build.xml'),
                    target: 'server:ejbdoclet',
                    dir: rootProject.projectDir
            ) {
                property(
                        name: 'build.src',
                        value: 'build/generated/sources/xdoclet/main'
                )
            }
        }
    }

    tasks.named('compileJava') {
        dependsOn tasks.named('generateEjbSources')
    }
    tasks.named('processResources') {
        dependsOn tasks.named('generateEjbSources')
    }
}

project(':client') {
    sourceSets.main.resources.srcDir('src')
    sourceSets.main.resources.include('**/Bundle*.properties')
    sourceSets.main.resources.include('**/*.xml')
    sourceSets.test.java.setSrcDirs(['test-src'])
    sourceSets.test.resources.setSrcDirs(['test-src'])
    sourceSets.test.resources.include('**/*.properties')

    dependencies {
        implementation project(':shared')
        implementation project(':annotation')
        implementation 'bsf:bsf:2.4.0'
        implementation 'org.apache-extras.beanshell:bsh:2.0b5'
        implementation 'commons-el:commons-el:1.0'
        implementation libs.commons.jxpath
        implementation libs.commons.validator
        implementation libs.taglibs.standard.impl
        implementation libs.taglibs.standard.spec
        implementation 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'
        implementation 'rhino:js:1.7R2'
        implementation 'net.sourceforge.thinlet:thinlet:2005-03-28'
        testImplementation 'junit:junit:4.13.2'
    }
}

project(':aspect') {
    sourceSets.main.resources.srcDir('src')
    sourceSets.main.resources.include('**/*.properties')

    dependencies {
        implementation project(':shared')
        implementation project(':server')
        implementation project(':client')
        implementation 'org.codehaus:aspectwerkz-nodeps-jdk5:2.1'
        implementation 'org.codehaus:aspectwerkz-jdk5:2.1'
        implementation 'backport175:backport175:1.0'
        implementation 'javax.ejb:ejb-api:3.0'
    }
}

project(':container') {
    dependencies {
        implementation libs.commons.logging
    }
}

project(':tests') {
    sourceSets.main.java.setSrcDirs([])
    sourceSets.main.resources.setSrcDirs([])

    sourceSets {
        integrationTest {
            java.setSrcDirs(['src'])
            resources.setSrcDirs(['src'])
            resources.include('**/*.properties', '**/*.xml')
        }
    }

    configurations {
        integrationTestImplementation.extendsFrom(testImplementation)
        integrationTestRuntimeOnly.extendsFrom(testRuntimeOnly)
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.hsqldb:hsqldb:1.8.0.10'
        testImplementation libs.commons.jxpath
        testImplementation libs.commons.validator
        testImplementation 'javax.persistence:persistence-api:1.0.2'
        testImplementation 'net.sourceforge.thinlet:thinlet:2005-03-28'
        testImplementation project(':shared')
        testImplementation project(':client')
        testImplementation project(':server')
        testImplementation project(':aspect')
    }

    tasks.register('integrationTest', Test) {
        description = 'Runs tests that require AspectWerkz weaving and the legacy integration environment.'
        group = 'verification'
        testClassesDirs = sourceSets.integrationTest.output.classesDirs
        classpath = sourceSets.integrationTest.runtimeClasspath
        useJUnit()
        dependsOn tasks.named('integrationTestClasses')
        onlyIf { project.hasProperty('runIntegrationTests') }
    }

    tasks.named('check') {
        dependsOn tasks.named('integrationTestClasses')
        dependsOn tasks.named('integrationTest')
    }
}

tasks.named('build') {
    dependsOn subprojects.collect { it.tasks.named('build') }
}
