plugins {
    id 'base'
}

configurations {
    aspectjTools
}

dependencies {
    aspectjTools libs.aspectj.tools
}

group = 'net.java.dev.genesis'
version = '3.4.0'

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    group = rootProject.group
    version = rootProject.version

    sourceSets {
        main {
            java.setSrcDirs(['src'])
            resources.setSrcDirs([])
        }
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_1_9)) {
            options.release.set(8)
        }
    }

    tasks.named('jar') {
        archiveBaseName.set("genesis-${project.name}")
    }
}

project(':shared') {
    sourceSets.main.java.srcDir project(':annotation').file('src')
    sourceSets.main.resources.srcDir('src')
    sourceSets.main.resources.include('**/Bundle*.properties')

    dependencies {
        api(libs.hibernate.core) {
            exclude group: 'javax.transaction', module: 'jta'
        }
        api 'javax.transaction:jta:1.1'
        api libs.commons.beanutils
        api libs.commons.logging
        api files(rootProject.file('lib/commons/reusable-components-20060810.jar'))
    }
}

project(':server') {
    dependencies {
        implementation project(':shared')
        implementation 'javax.ejb:ejb-api:3.0'
    }
}

project(':client') {
    sourceSets.main.resources.srcDir('src')
    sourceSets.main.resources.include('**/Bundle*.properties')
    sourceSets.main.resources.include('**/*.xml')
    sourceSets.test.java.setSrcDirs(['test-src'])
    sourceSets.test.resources.setSrcDirs(['test-src'])
    sourceSets.test.resources.include('**/*.properties')

    dependencies {
        implementation project(':shared')
        implementation project(':annotation')
        implementation 'bsf:bsf:2.4.0'
        implementation 'org.apache-extras.beanshell:bsh:2.0b5'
        implementation 'commons-el:commons-el:1.0'
        implementation libs.commons.jxpath
        implementation libs.commons.validator
        implementation libs.taglibs.standard.impl
        implementation libs.taglibs.standard.spec
        implementation 'javax.servlet.jsp:javax.servlet.jsp-api:2.3.3'
        implementation 'rhino:js:1.7R2'
        implementation 'net.sourceforge.thinlet:thinlet:2005-03-28'
        testImplementation 'junit:junit:4.13.2'
        testRuntimeOnly libs.aspectj.runtime
        testRuntimeOnly files(project(':aspect').sourceSets.main.output.classesDirs)
    }
}

project(':aspect') {
    sourceSets.main.resources.srcDir('src')
    sourceSets.main.resources.include('**/*.properties')

    dependencies {
        implementation project(':shared')
        implementation project(':server')
        implementation project(':client')
        api libs.aspectj.runtime
        implementation 'javax.ejb:ejb-api:3.0'
    }
}

project(':container') {
    dependencies {
        implementation libs.commons.logging
    }
}

project(':tests') {
    def embeddedModule = layout.buildDirectory.dir('embedded/container')

    sourceSets.main.java.setSrcDirs([])
    sourceSets.main.resources.setSrcDirs([])

    sourceSets {
        integrationTest {
            java.setSrcDirs(['src'])
            resources.setSrcDirs(['src'])
            resources.include('**/*.properties', '**/*.xml')
        }
    }

    configurations {
        integrationTestImplementation.extendsFrom(testImplementation)
        integrationTestRuntimeOnly.extendsFrom(testRuntimeOnly)
    }

    configurations.named('integrationTestRuntimeClasspath') {
        resolutionStrategy.force libs.hsqldb
    }

    tasks.register('prepareEmbeddedContainer', Sync) {
        dependsOn tasks.named('integrationTestClasses')

        from project(':annotation').sourceSets.main.output
        from project(':shared').sourceSets.main.output
        from project(':client').sourceSets.main.output
        from project(':server').sourceSets.main.output
        from project(':aspect').sourceSets.main.output
        from sourceSets.integrationTest.output
        from('src/embedded')
        into embeddedModule
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
        integrationTestImplementation(
                "org.hsqldb:hsqldb:${libs.versions.hsqldb.get()}:jdk8")
        testImplementation libs.commons.jxpath
        testImplementation libs.commons.validator
        testImplementation libs.javax.persistence.api
        testImplementation 'net.sourceforge.thinlet:thinlet:2005-03-28'
        integrationTestImplementation libs.tomee.embedded.core
        testImplementation project(':shared')
        testImplementation project(':client')
        testImplementation project(':server')
        testImplementation project(':aspect')
    }

    tasks.register('integrationTest', Test) {
        description = 'Runs the complete integration suite in the embedded EJB container.'
        group = 'verification'
        testClassesDirs = files(embeddedModule)
        classpath = files(embeddedModule) + sourceSets.integrationTest.runtimeClasspath
        systemProperty 'genesis.embedded.module', embeddedModule.get().asFile.absolutePath
        exclude '**/TestCase.class'
        exclude '**/ValidatorTest.class'
        useJUnit()
        dependsOn tasks.named('prepareEmbeddedContainer')
    }

    tasks.named('check') {
        dependsOn tasks.named('integrationTest')
    }
}

tasks.named('build') {
    dependsOn subprojects.collect { it.tasks.named('build') }
}

def aspectjWeaving = tasks.register('weaveAspectJ') {
    group = 'build'
    description = 'Post-compile weaves the Genesis AspectJ aspects into project classes.'
    outputs.upToDateWhen { false }

    def compilationTasks = []
    subprojects.each { subproject ->
        subproject.sourceSets.each { sourceSet ->
            def compileTask = subproject.tasks.findByName(sourceSet.getCompileTaskName('java'))
            if (compileTask != null) {
                compilationTasks.add(compileTask)
            }
        }
    }
    dependsOn compilationTasks

    doLast {
        def aspectClasses = project(':aspect').sourceSets.main.output.classesDirs.singleFile
        if (!aspectClasses.exists()) {
            throw new GradleException("AspectJ aspects were not compiled: ${aspectClasses}")
        }

        def classpathFiles = new LinkedHashSet<File>()
        subprojects.each { subproject ->
            subproject.sourceSets.each { sourceSet ->
                classpathFiles.addAll(sourceSet.output.classesDirs.files)
                classpathFiles.addAll(sourceSet.compileClasspath.files.findAll {
                    !it.name.startsWith('genesis-')
                })
            }
        }
        classpathFiles.addAll(configurations.aspectjTools.files)

        def weaveOutput = { subproject, sourceSet, classDirectory ->
            if (!classDirectory.exists() || !classDirectory.listFiles()?.any {
                it.name.endsWith('.class') || it.isDirectory()
            }) {
                return
            }

            def wovenDirectory = layout.buildDirectory.dir(
                    "aspectj-woven/${subproject.name}/${sourceSet.name}").get().asFile
            delete wovenDirectory
            wovenDirectory.mkdirs()

            javaexec {
                classpath = configurations.aspectjTools
                mainClass = 'org.aspectj.tools.ajc.Main'
                args '-inpath', classDirectory.absolutePath,
                        '-aspectpath', aspectClasses.absolutePath,
                        '-classpath', classpathFiles.collect { it.absolutePath }
                                .join(File.pathSeparator),
                        '-d', wovenDirectory.absolutePath,
                        '-Xlint:ignore'
            }

            delete classDirectory
            copy {
                from wovenDirectory
                into classDirectory
            }
            delete wovenDirectory
        }

        project(':aspect').sourceSets.main.output.classesDirs.files.each {
            weaveOutput(project(':aspect'), project(':aspect').sourceSets.main, it)
        }

        subprojects.findAll { it.name != 'aspect' }.each { subproject ->
            subproject.sourceSets.each { sourceSet ->
                sourceSet.output.classesDirs.files.each { classDirectory ->
                    weaveOutput(subproject, sourceSet, classDirectory)
                }
            }

            def thinletJar = project(':client').sourceSets.main.compileClasspath.files
                    .find { it.name.startsWith('thinlet-') && it.name.endsWith('.jar') }
            if (thinletJar == null) {
                throw new GradleException('Thinlet dependency was not found for AspectJ weaving')
            }
            def wovenThinlet = layout.buildDirectory.dir(
                    'aspectj-woven/dependencies/thinlet').get().asFile
            delete wovenThinlet
            wovenThinlet.mkdirs()
            javaexec {
                classpath = configurations.aspectjTools
                mainClass = 'org.aspectj.tools.ajc.Main'
                args '-inpath', thinletJar.absolutePath,
                        '-aspectpath', aspectClasses.absolutePath,
                        '-classpath', (classpathFiles + thinletJar)
                                .collect { it.absolutePath }.join(File.pathSeparator),
                        '-d', wovenThinlet.absolutePath,
                        '-Xlint:ignore'
            }
        }
    }
}

subprojects {
    tasks.withType(Test).configureEach {
        dependsOn aspectjWeaving
        classpath = files(rootProject.layout.buildDirectory.dir(
                'aspectj-woven/dependencies/thinlet')) + classpath
    }

    project(':tests').tasks.named('prepareEmbeddedContainer').configure {
        dependsOn aspectjWeaving
    }
    tasks.named('jar').configure {
        dependsOn aspectjWeaving
    }
}
